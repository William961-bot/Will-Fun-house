<title>Shadows Wired Twice 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Shippori+Mincho:wght@600;800&display=swap">
<style>

  body { touch-action:none; user-select:none; -webkit-user-select:none; }

  #g3 { outline:none; }
  #hud { pointer-events:none; }
  #pad { position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:space-between; align-items:flex-end;
         gap:12px; padding:12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); pointer-events:none; }
  #pad[hidden] { display:none; }
  #joy { width:124px; height:124px; border:1px solid rgba(233,227,209,.35); border-radius:50%; pointer-events:auto;
         position:relative; background:rgba(10,12,19,.35); touch-action:none; }
  #knob { position:absolute; left:50%; top:50%; width:44px; height:44px; margin:-22px 0 0 -22px; border-radius:50%;
          border:1px solid rgba(233,227,209,.7); }

                font:600 10px "IBM Plex Mono", ui-monospace, monospace; letter-spacing:.06em; border-radius:3px;
                touch-action:none; padding:0; }
  #pad button.wide { grid-column:span 3; border-color:rgba(143,230,242,.6); color:#8fe6f2; }
  #pad button.on { background:rgba(233,227,209,.2); }
</style>

<canvas id="g3" tabindex="0" aria-label="Shadows Wired Twice 3D"></canvas>
<canvas id="hud"></canvas>
<div id="pad" hidden>
  <div id="joy" aria-label="Move"><div id="knob"></div></div>
  <div class="cl">
    <button data-k="lock">LOCK</button><button data-k="heal">GOURD</button><button data-k="roll">ROLL</button><button data-k="dge">STEP</button><button data-k="jump">JUMP</button>
    <button data-k="grd">GUARD</button><button data-k="hvy">HEAVY</button><button data-k="atk" class="wide">STRIKE</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv3 = $('g3'), hud = $('hud'), hx = hud.getContext('2d'), pad = $('pad'), joyEl = $('joy'), knob = $('knob');

  pb:'#8fe6f2', eb:'#f3a36f', petal:'#d98fa8', enemy:'#c4bcab', ronin:'#b8c4d8', boss:'#f3dccb', torii:'#a8323a'

}
const V3 = THREE.Vector3;
const _v = new V3(), _v2 = new V3();

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ canvas: cv3, antialias: true });

const camera = new THREE.PerspectiveCamera(58, 1, .1, 900);

const sfx = {
  swing() { noise(.12, .16, 1300); },
  clang() { tone(2400, .35, 'triangle', .22); tone(3610, .25, 'sine', .14); tone(1210, .2, 'square', .05); noise(.08, .28, 6000, 'highpass'); },
  // parry: sharp transient + inharmonic metal partials; slight random pitch so rapid deflects don't sound cloned

  },

  peril() { tone(180, .5, 'sawtooth', .12, 170); tone(271, .5, 'sawtooth', .07); },
  brk()   { tone(520, .45, 'square', .1, 90); },
  exec()  { noise(.3, .5, 500, 'lowpass'); tone(90, .6, 'sawtooth', .2, 40); tone(1800, .5, 'sine', .1); },

  shatter(){ noise(.18, .2, 5000, 'highpass'); tone(3300, .25, 'sine', .05, 2200); },
  heal()  { tone(600, .35, 'sine', .14, 900); },
  die()   { tone(110, 1.4, 'sawtooth', .18, 40); },
  jump()  { noise(.06, .1, 900); },
  roll()  { noise(.3, .18, 400, 'lowpass'); noise(.12, .08, 1600); },
  idol()  { tone(660, .6, 'sine', .14); tone(990, .8, 'sine', .09); },
  adapt() { tone(220, .25, 'square', .08, 330); tone(440, .3, 'triangle', .06, 660); },
  read()  { tone(330, .18, 'square', .1, 990); noise(.05, .2, 4000, 'highpass'); },

// ---------- input ----------
const keys = {}, pressed = {};
const KM = { KeyW:'fw', KeyS:'bk', KeyA:'lf', KeyD:'rt', ArrowUp:'fw', ArrowDown:'bk', ArrowLeft:'camL', ArrowRight:'camR',
  Space:'jump', ShiftLeft:'dge', ShiftRight:'dge', KeyL:'dge', KeyJ:'atk', KeyF:'hvy', KeyK:'grd', KeyQ:'lock', Tab:'lock',
  KeyE:'heal', KeyR:'rst', Enter:'atk', KeyC:'roll' };

addEventListener('keydown', ev => {
  initAudio(); inputMode = 'kb'; const a = KM[ev.code];
  if (game.mode === 'title') { startGame(); ev.preventDefault(); return; }
  if (a) { press(a); ev.preventDefault(); }
});
addEventListener('keyup', ev => { const a = KM[ev.code]; if (a) keys[a] = false; });

const drag = { id:null, x:0, y:0 };
cv3.addEventListener('pointerdown', ev => {
  initAudio(); cv3.focus();
  if (game.mode === 'title') { startGame(); tryLock(); return; }
  if (ev.pointerType === 'mouse') {
    inputMode = 'kb';
    if (document.pointerLockElement !== cv3 && game.mode === 'play') { tryLock(); }
    press(ev.button === 2 ? 'grd' : ev.button === 1 ? 'lock' : 'atk');
    if (ev.button === 1) ev.preventDefault();
  } else {
    if (game.mode !== 'play') { press('atk'); return; }
    drag.id = ev.pointerId; drag.x = ev.clientX; drag.y = ev.clientY;
  }
});
addEventListener('pointerup', ev => {
  if (ev.pointerType === 'mouse') keys[ev.button === 2 ? 'grd' : ev.button === 1 ? 'lock' : 'atk'] = false;
  if (ev.pointerId === drag.id) drag.id = null;
});
addEventListener('pointermove', ev => {
  if (ev.pointerId === drag.id) {
    cam.yaw -= (ev.clientX - drag.x) * .006; cam.pitch = clamp(cam.pitch + (ev.clientY - drag.y) * .004, -.15, .95);
    drag.x = ev.clientX; drag.y = ev.clientY;
  }
});
document.addEventListener('mousemove', ev => {
  if (document.pointerLockElement !== cv3) return;
  cam.yaw -= ev.movementX * .0026; cam.pitch = clamp(cam.pitch + ev.movementY * .002, -.15, .95);
});
pad.querySelectorAll('button').forEach(b => {
  const k = b.dataset.k;
  const up = () => { keys[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', ev => { ev.preventDefault(); initAudio(); if (game.mode === 'title') { startGame(); return; } press(k); b.classList.add('on'); });
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
});
const joy = { x:0, y:0, id:null };

// ---------- gamepad (standard / Xbox layout) ----------
const PADMAP = [[5,'atk'], [7,'hvy'], [4,'grd'], [6,'grd'], [0,'jump'], [1,'dge'], [2,'roll'], [3,'heal'], [11,'lock'], [9,'rst']];

let padName = null;

addEventListener('gamepadconnected', () => { inputMode = 'pad'; });
function moveJoy(ev) {

  let dx = (ev.clientX - (r.left + r.width / 2)) / (r.width / 2), dy = (ev.clientY - (r.top + r.height / 2)) / (r.height / 2);
  const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; }

}
joyEl.addEventListener('pointerdown', ev => { ev.preventDefault(); initAudio(); if (game.mode === 'title') { startGame(); return; } joy.id = ev.pointerId; joyEl.setPointerCapture(ev.pointerId); moveJoy(ev); });

// ---------- number textures ----------
function weapon(name, len, color, butt) { const c = codes(name); return { name, codes:c, str:c.join(' ') + '  ', len, color, butt }; }
const WP = {
  kusabimaru: weapon('KUSABIMARU', .88, C.pb, .22),
  katana:     weapon('KATANA', .8, C.eb, .2),
  yari:       weapon('YARI', 1.5, C.eb, .95),
  nodachi:    weapon('NODACHI', 1.25, C.eb, .3),
  tomoe:      weapon('TOMOE', .98, C.boss, .24),
};
function drawBladeCanvas(wp) {
  const c = wp.canvas || (wp.canvas = document.createElement('canvas'));
  c.width = 1024; c.height = 64;
  const g = c.getContext('2d'); g.clearRect(0, 0, 1024, 64);
  let s = wp.str; while (s.length < 30) s += wp.str;
  const fs = Math.min(52, 1024 / (s.length * .62));
  g.font = `600 ${fs}px ${MONO}`; g.fillStyle = wp.color; g.textBaseline = 'middle'; g.textAlign = 'left';
  g.shadowColor = wp.color; g.shadowBlur = 8;

}
for (const k in WP) { drawBladeCanvas(WP[k]); WP[k].tex = new THREE.CanvasTexture(WP[k].canvas); }
const numCache = {};
function numTex(txt, color) {
  const key = txt + color; if (numCache[key]) return numCache[key];
  const c = document.createElement('canvas'); c.width = 128; c.height = 64;
  const g = c.getContext('2d'); g.font = `600 46px ${MONO}`; g.fillStyle = color; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = color; g.shadowBlur = 6; g.fillText(txt, 64, 34);
  return (numCache[key] = new THREE.CanvasTexture(c));
}
try {
  document.fonts.load('80px "Shippori Mincho"', '危死忍殺回生隻狼').catch(() => {});
  document.fonts.load('600 40px "IBM Plex Mono"').then(() => { for (const k in WP) drawBladeCanvas(WP[k]); for (const k in numCache) delete numCache[k]; }).catch(() => {});
} catch (e) {}

// number sprites: sparks, blood, and blade trails are all ASCII codes
const POOL = [];
for (let i = 0; i < 420; i++) {
  const m = new THREE.SpriteMaterial({ map:numTex('0', C.bone), transparent:true, depthWrite:false, blending:THREE.AdditiveBlending });
  const s = new THREE.Sprite(m); s.visible = false; scene.add(s);
  POOL.push({ s, m, life:0, max:1, vel:new V3(), grav:0, size:.15 });
}
let poolI = 0;
function spawnNum(pos, txt, color, vel, life, size, grav) {
  const q = POOL[poolI = (poolI + 1) % POOL.length];
  q.m.map = numTex(String(txt), color); q.s.position.copy(pos); q.vel.copy(vel);
  q.life = q.max = life; q.size = size; q.grav = grav; q.s.visible = true; q.s.scale.set(size * 2, size, 1);
}
// streak sparks for weapon clashes
const SPARK_N = 72, sparkArr = new Float32Array(SPARK_N * 6), sparkCol = new Float32Array(SPARK_N * 6), sparks = [];
const sparkGeo = new THREE.BufferGeometry();

sparkGeo.setAttribute('color', new THREE.BufferAttribute(sparkCol, 3));

let sparkI = 0;

  for (let i = 0; i < n; i++) {
    const s = sparks[sparkI = (sparkI + 1) % SPARK_N];
    s.p.copy(pos); s.v.set(rand(-1, 1), rand(-.2, 1), rand(-1, 1)).normalize().multiplyScalar(spd * rand(.5, 1.3));

const glowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  const r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  r.addColorStop(0, 'rgba(255,255,245,1)'); r.addColorStop(.25, 'rgba(255,214,130,.85)'); r.addColorStop(1, 'rgba(242,180,65,0)');

const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex, transparent:true, depthWrite:false, depthTest:false, blending:THREE.AdditiveBlending }));
glow.visible = false; scene.add(glow);
const clash = { glowT:0, flashT:0, flashA:0, last:-9, dodgeT:0 };

// ---------- afterimages ----------
// a ghost is a frozen clone of a fighter's wire body, recoloured and faded out
const ghosts = [];
function makeGhost(f, color, opacity, life) {
  f.body.root.updateMatrixWorld(true);
  const obj = f.body.root.clone(true);
  const lineMat = new THREE.LineBasicMaterial({ color:HEX(color), transparent:true, opacity, blending:THREE.AdditiveBlending, depthWrite:false });
  const bladeMat = new THREE.MeshBasicMaterial({ color:HEX(color), map:f.wp.tex, transparent:true, opacity, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide });
  const eyeMat = new THREE.MeshBasicMaterial({ color:HEX(color), transparent:true, opacity, blending:THREE.AdditiveBlending, depthWrite:false });

    if (o.isLine) {
      if (f.body.scarf && o.geometry === f.body.scarf.geometry) { o.geometry = o.geometry.clone(); own.push(o.geometry); }

  for (const g of ghosts) {
    if (g.pending) continue;
    g.life -= dt;
    const k = clamp(g.life / g.max, 0, 1);
    let a = g.base * k * k;
    if (g.perfect) {
      const age = g.max - g.life;
      if (!g.shattered && age > .2) {  // the enemy's blade passes through the ghost and it breaks into its codes
        g.shattered = true; sfx.shatter();
        const c = g.obj.position.clone(); c.y += 1.2;
        burst(c, player.wp.codes, C.pb, 16, 3, 1.5); spawnSparks(c, 8, 5);
      }
      a = g.shattered ? g.base * k * k : g.base * (.75 + .25 * Math.sin(T * 45));
      if (g.shattered) g.obj.scale.multiplyScalar(1 + dt * .5);
    }
    for (const m of g.mats) m.opacity = a;
  }
  for (let i = ghosts.length - 1; i >= 0; i--) {

// dodge/roll start: leave a hidden snapshot where the player stood; a perfect dodge reveals it

  p.startGhost = g; p.ghostT = 0;
}

    const s = sparks[i], o = i * 6;

const lm = (c, op = 1, fog = true) => new THREE.LineBasicMaterial({ color:HEX(c), transparent:op < 1, opacity:op, fog });
function addWire(geo, mat, x, y, z, ry = 0, parent = scene) {

  // idols
  for (const id of IDOLS) {
    const mat = lm(C.dim, .9); idolMats.push(mat);

    addWire(new THREE.BoxGeometry(.8, .3, .8), mat, 0, .15, 0, 0, g);

}
