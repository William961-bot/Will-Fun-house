<title>Shadows Wired Twice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Shippori+Mincho:wght@600;800&display=swap">
<style>
  :root { --ink:#0a0c13; --bone:#e9e3d1; --blood:#e3343f; color-scheme:dark; }
  html, body { height:100%; margin:0; background:var(--ink); overflow:hidden; overscroll-behavior:none; }
  body { touch-action:none; user-select:none; -webkit-user-select:none; }
  #g { display:block; width:100%; height:100%; outline:none; cursor:crosshair; }
  #pad { position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:space-between; align-items:flex-end;
         gap:12px; padding:12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); pointer-events:none; }
  #pad[hidden] { display:none; }
  .cl { display:flex; gap:10px; pointer-events:auto; }
  .cl.r { display:grid; grid-template-columns:repeat(3, 60px); gap:8px; }
  #pad button { height:48px; min-width:60px; border:1px solid rgba(233,227,209,.4); background:rgba(10,12,19,.6);
                color:var(--bone); font:600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing:.08em;
                border-radius:3px; touch-action:none; padding:0; }
  .cl.l button { width:68px; height:60px; font-size:18px; }
  #pad button.wide { grid-column:span 2; border-color:rgba(143,230,242,.6); color:#8fe6f2; }
  #pad button.on { background:rgba(233,227,209,.2); }
</style>

<canvas id="g" tabindex="0" aria-label="Shadows Wired Twice game canvas"></canvas>
<div id="pad" hidden>
  <div class="cl l"><button data-k="l" aria-label="Move left">◀</button><button data-k="r" aria-label="Move right">▶</button></div>
  <div class="cl r">
    <button data-k="heal">GOURD</button><button data-k="dge">STEP</button><button data-k="jump">JUMP</button>
    <button data-k="grd">GUARD</button><button data-k="atk" class="wide">STRIKE</button>
  </div>
</div>

<script>
(() => {
'use strict';
// ---------- setup ----------
const cv = document.getElementById('g'), ctx = cv.getContext('2d');
const pad = document.getElementById('pad');
const isTouch = matchMedia('(pointer: coarse)').matches;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (isTouch) pad.hidden = false;

const C = {
  ink:'#0a0c13', sky:'#171e33', mist:'#4a5470', fog:'#121726', bone:'#e9e3d1', dim:'#8b8fa3',
  blood:'#e3343f', gold:'#f2b441', pb:'#8fe6f2', eb:'#f3a36f', petal:'#d98fa8', enemy:'#c4bcab', boss:'#f3dccb'
};
const MONO = '"IBM Plex Mono", ui-monospace, Consolas, monospace';
const SERIF = '"Shippori Mincho", "Yu Mincho", "Hiragino Mincho ProN", serif';
try { document.fonts.load('80px "Shippori Mincho"', '危死忍殺回生隻狼').catch(()=>{}); document.fonts.load('12px "IBM Plex Mono"').catch(()=>{}); } catch (e) {}

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const sgn = v => v < 0 ? -1 : 1;

const GROUND = 440, WORLD_R = 4000, ARENA_L = 3050, ARENA_R = 3950, BOSS_X = 3640;
const IDOLS = [140, 2800];

let W, H, DPR, S, VW, VH, OY;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const reserve = isTouch ? 140 : 0;
  S = Math.min((H - reserve) / 540, W / 760);
  VW = W / S; VH = H / S;
  OY = ((H - reserve) / S - 540) / 2;
}
addEventListener('resize', resize); resize();

// ---------- weapons: blades made of ASCII codes ----------
const codes = s => [...s].map(c => c.charCodeAt(0));
function weapon(name, len, color, butt) { const c = codes(name); return { name, codes: c, str: c.join(' ') + ' ', len, color, butt }; }
const WP = {
  kusabimaru: weapon('KUSABIMARU', 64, C.pb, 11),
  katana:     weapon('KATANA', 56, C.eb, 10),
  yari:       weapon('YARI', 96, C.eb, 34),
  tomoe:      weapon('TOMOE', 70, C.boss, 12),
};

// ---------- audio ----------
let AC = null, master = null, NB = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = .35; master.connect(AC.destination); } catch (e) { AC = null; }
}
function tone(f, d, type = 'sine', v = .3, f2) {
  if (!AC) return; const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g).connect(master); o.start(t); o.stop(t + d + .02);
}
function noise(d, v = .3, freq = 2000, type = 'bandpass') {
  if (!AC) return;
  if (!NB) { NB = AC.createBuffer(1, AC.sampleRate * .5, AC.sampleRate); const a = NB.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1; }
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NB; f.type = type; f.frequency.value = freq; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + d + .02);
}
const sfx = {
  swing() { noise(.12, .16, 1300, 'bandpass'); },
  clang() { tone(2400, .35, 'triangle', .22); tone(3610, .25, 'sine', .14); tone(1210, .2, 'square', .05); noise(.08, .28, 6000, 'highpass'); },
  block() { tone(880, .15, 'triangle', .18); noise(.08, .22, 3000, 'bandpass'); },
  hit()   { noise(.14, .4, 700, 'lowpass'); tone(160, .15, 'sawtooth', .14, 60); },
  peril() { tone(180, .5, 'sawtooth', .12, 170); tone(271, .5, 'sawtooth', .07); },
  brk()   { tone(520, .45, 'square', .1, 90); },
  exec()  { noise(.3, .5, 500, 'lowpass'); tone(90, .6, 'sawtooth', .2, 40); tone(1800, .5, 'sine', .1); },
  mikiri(){ tone(1400, .2, 'square', .1, 300); noise(.1, .3, 2000); },
  heal()  { tone(600, .35, 'sine', .14, 900); },
  die()   { tone(110, 1.4, 'sawtooth', .18, 40); },
  jump()  { noise(.06, .1, 900); },
  idol()  { tone(660, .6, 'sine', .14); tone(990, .8, 'sine', .09); },
};

// ---------- input ----------
const keys = {}, pressed = {};
const KM = { ArrowLeft:'l', KeyA:'l', ArrowRight:'r', KeyD:'r', ArrowUp:'jump', KeyW:'jump', Space:'jump',
  KeyJ:'atk', KeyZ:'atk', KeyK:'grd', KeyX:'grd', KeyL:'dge', ShiftLeft:'dge', ShiftRight:'dge', KeyC:'dge',
  KeyE:'heal', KeyH:'heal', KeyR:'rst', Enter:'atk' };
function press(a) { if (!keys[a]) pressed[a] = true; keys[a] = true; }
addEventListener('keydown', ev => {
  initAudio(); const a = KM[ev.code];
  if (game.mode === 'title') { startGame(); ev.preventDefault(); return; }
  if (a) { press(a); ev.preventDefault(); }
});
addEventListener('keyup', ev => { const a = KM[ev.code]; if (a) keys[a] = false; });
cv.addEventListener('contextmenu', ev => ev.preventDefault());
cv.addEventListener('pointerdown', ev => {
  initAudio(); cv.focus();
  if (game.mode === 'title') { startGame(); return; }
  if (ev.pointerType === 'mouse') press(ev.button === 2 ? 'grd' : 'atk');
  else if (game.mode !== 'play') press('atk');
});
cv.addEventListener('pointerup', ev => { if (ev.pointerType === 'mouse') keys[ev.button === 2 ? 'grd' : 'atk'] = false; });
pad.querySelectorAll('button').forEach(b => {
  const k = b.dataset.k;
  const up = () => { keys[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', ev => { ev.preventDefault(); initAudio(); if (game.mode === 'title') { startGame(); return; } press(k); b.classList.add('on'); });
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
});

// ---------- poses (facing right, feet at y=0) ----------
const PK = ['hd','nk','hp','eF','hF','eB','hB','kF','fF','kB','fB'];
const LEGS_IDLE = { kF:[10,-21], fF:[13,0], kB:[-9,-20], fB:[-14,0] };
const LEGS_LUNGE = { kF:[17,-19], fF:[25,0], kB:[-10,-18], fB:[-21,0] };
const P = {
  idle:      { hd:[3,-83], nk:[1,-72], hp:[-1,-40], eF:[12,-58], hF:[20,-50], eB:[5,-58], hB:[15,-48], ...LEGS_IDLE, wa:-.75 },
  guard:     { hd:[1,-81], nk:[-1,-71], hp:[-3,-39], eF:[14,-62], hF:[19,-70], eB:[5,-62], hB:[12,-66], kF:[11,-21], fF:[16,0], kB:[-11,-19], fB:[-17,0], wa:-1.3 },
  windup:    { hd:[0,-82], nk:[-1,-71], hp:[-2,-40], eF:[5,-80], hF:[-3,-89], eB:[-5,-77], hB:[-7,-86], kF:[12,-20], fF:[18,0], kB:[-10,-19], fB:[-18,0], wa:-2.5 },
  slash:     { hd:[9,-78], nk:[6,-68], hp:[0,-38], eF:[22,-58], hF:[31,-46], eB:[14,-58], hB:[25,-44], ...LEGS_LUNGE, wa:.55 },
  lowwind:   { hd:[1,-80], nk:[0,-70], hp:[-2,-39], eF:[6,-54], hF:[-1,-40], eB:[-4,-55], hB:[-3,-42], kF:[12,-20], fF:[18,0], kB:[-10,-19], fB:[-18,0], wa:2.6 },
  rise:      { hd:[6,-83], nk:[4,-72], hp:[0,-40], eF:[18,-70], hF:[24,-81], eB:[12,-68], hB:[20,-78], ...LEGS_LUNGE, wa:-1.15 },
  thrustwind:{ hd:[-4,-80], nk:[-5,-70], hp:[-4,-40], eF:[-6,-56], hF:[-14,-54], eB:[-10,-58], hB:[-19,-55], kF:[12,-20], fF:[20,0], kB:[-14,-19], fB:[-24,0], wa:.02 },
  thrust:    { hd:[14,-76], nk:[11,-67], hp:[2,-38], eF:[28,-60], hF:[40,-58], eB:[22,-60], hB:[34,-57], kF:[20,-18], fF:[30,0], kB:[-12,-16], fB:[-26,0], wa:.02 },
  sweepwind: { hd:[-2,-66], nk:[-3,-56], hp:[-4,-30], eF:[-4,-40], hF:[-14,-30], eB:[-8,-42], hB:[-17,-32], kF:[12,-16], fF:[17,0], kB:[-14,-12], fB:[-19,0], wa:2.9 },
  sweep:     { hd:[6,-64], nk:[4,-54], hp:[-2,-30], eF:[20,-36], hF:[32,-18], eB:[14,-36], hB:[26,-20], kF:[14,-16], fF:[19,0], kB:[-14,-12], fB:[-21,0], wa:.12 },
  hurt:      { hd:[-8,-78], nk:[-6,-68], hp:[-2,-40], eF:[4,-56], hF:[10,-48], eB:[-2,-56], hB:[6,-48], kF:[8,-21], fF:[12,0], kB:[-12,-19], fB:[-17,0], wa:-.2 },
  broken:    { hd:[7,-58], nk:[4,-50], hp:[-4,-26], eF:[10,-36], hF:[14,-20], eB:[2,-36], hB:[5,-22], kF:[10,-14], fF:[2,0], kB:[-10,-2], fB:[-24,0], wa:1.3 },
  jump:      { hd:[2,-84], nk:[0,-73], hp:[-1,-42], eF:[12,-60], hF:[20,-52], eB:[5,-60], hB:[15,-50], kF:[12,-32], fF:[6,-18], kB:[-4,-30], fB:[-12,-16], wa:-.9 },
  dodge:     { hd:[-2,-70], nk:[-3,-60], hp:[-3,-34], eF:[8,-48], hF:[16,-42], eB:[0,-48], hB:[10,-40], kF:[12,-16], fF:[18,0], kB:[-12,-14], fB:[-22,0], wa:-.3 },
  deathblow: { hd:[10,-76], nk:[8,-66], hp:[0,-38], eF:[24,-62], hF:[30,-52], eB:[18,-62], hB:[26,-54], ...LEGS_LUNGE, wa:.9 },
  mikiri:    { hd:[-2,-80], nk:[-2,-70], hp:[-3,-40], eF:[10,-58], hF:[16,-50], eB:[2,-58], hB:[12,-49], kF:[14,-34], fF:[22,-8], kB:[-8,-20], fB:[-12,0], wa:-.6 },
  drink:     { hd:[3,-83], nk:[1,-72], hp:[-1,-40], eF:[12,-58], hF:[18,-50], eB:[10,-64], hB:[7,-79], ...LEGS_IDLE, wa:.9 },
};
const clonePose = p => { const o = { wa:p.wa }; for (const k of PK) o[k] = [p[k][0], p[k][1]]; return o; };

// player combo: overhead, rising, heavy overhead
const PATK = [
  { w:'windup',  s:'slash', wind:.11, act:.09, rec:.2,  lunge:26, dmg:12, post:9 },
  { w:'lowwind', s:'rise',  wind:.10, act:.09, rec:.2,  lunge:22, dmg:12, post:9 },
  { w:'windup',  s:'slash', wind:.14, act:.10, rec:.32, lunge:38, dmg:17, post:13 },
];
// enemy moves: each is a list of strikes
const st = (w, s, wind, act, rec, dmg, post, lunge, peril) => ({ w, s, wind, act, rec, dmg, post, lunge, peril });
const MOVES = {
  slash:       [st('windup','slash',.5,.12,.4,14,22,40)],
  double:      [st('windup','slash',.45,.12,.1,13,20,40), st('lowwind','rise',.28,.12,.45,12,18,30)],
  poke:        [st('thrustwind','thrust',.42,.12,.4,13,20,30)],
  perilThrust: [st('thrustwind','thrust',.72,.14,.6,30,35,120,'thrust')],
  perilSweep:  [st('sweepwind','sweep',.72,.16,.6,26,30,80,'sweep')],
  combo2:      [st('windup','slash',.36,.11,.08,15,20,55), st('lowwind','rise',.22,.11,.45,14,20,40)],
  combo3:      [st('windup','slash',.34,.11,.08,15,20,50), st('lowwind','rise',.2,.11,.08,14,20,35), st('windup','slash',.26,.12,.5,18,24,60)],
};
const TPL = {
  grunt: { name:'Ashina Soldier', maxHp:60, maxPost:60, speed:95, reach:72, wp:WP.katana, guard:.25, deflect:0, marks:1, hat:'jingasa', col:C.enemy, cd:[1.3,2.4], moves:[['slash',1],['double',.45]] },
  spear: { name:'Ashina Spearman', maxHp:70, maxPost:70, speed:85, reach:112, wp:WP.yari, guard:.2, deflect:0, marks:1, hat:'jingasa', col:C.enemy, cd:[1.5,2.6], moves:[['poke',1],['perilThrust',.5]] },
  boss:  { name:'Genichiro Ashina', sub:'Way of Tomoe', maxHp:200, maxPost:150, speed:150, reach:86, wp:WP.tomoe, guard:.5, deflect:.45, marks:2, hat:'crest', col:C.boss, sc:1.12, boss:true, cd:[.6,1.4], moves:[['combo3',1],['combo2',.8],['perilThrust',.45],['perilSweep',.45]] },
};
const SPAWNS = [['grunt',760],['spear',1180],['grunt',1560],['grunt',1650],['spear',2060],['grunt',2420],['spear',2530]];
const HINTS = [
  [240,  'J strike   ·   K guard, tapped as the blade lands = DEFLECT'],
  [620,  'Fill the gold posture bar, then strike: DEATHBLOW'],
  [1060, '危 thrust → L / Shift toward it: MIKIRI   ·   危 sweep → jump'],
  [2720, 'Sculptor’s idol: rest and refill   ·   E drinks from the gourd'],
  [2960, 'Beyond this gate waits the lord of the keep'],
];

// ---------- entities ----------
function fighter(o) {
  return Object.assign({ x:0, y:GROUND, vx:0, vy:0, f:1, state:'idle', st:0, post:0, postCool:0, air:false,
    pose:clonePose(P.idle), walkPh:0, sc:1, rot:0, trail:[], alive:true, hitFlash:0, col:C.bone, hpLag:0 }, o);
}
function newPlayer(x) {
  const p = fighter({ x, isP:true, maxHp:100, hp:100, maxPost:100, wp:WP.kusabimaru, reach:82, rez:1, gourd:3,
    combo:0, ph:'wind', atkId:0, lastAtkEnd:-9, guardPress:-9, atkBuf:0, dgBuf:0, jBuf:0, dgDir:1, hitDone:false });
  p.hpLag = p.hp; return p;
}
function mkEnemy(type, x) {
  const t = TPL[type];
  const e = fighter({ type, x, f:-1, name:t.name, sub:t.sub, maxHp:t.maxHp, hp:t.maxHp, maxPost:t.maxPost, speed:t.speed,
    reach:t.reach, wp:t.wp, guard:t.guard, deflect:t.deflect, marks:t.marks, maxMarks:t.marks, hat:t.hat, col:t.col,
    sc:t.sc || 1, boss:!!t.boss, cdR:t.cd, moves:t.moves, cd:rand(...t.cd), tm:1, guardBias:0, aggro:false,
    seenAtk:-1, guardHits:0, phase:1, peril:0, periKind:null });
  e.hpLag = e.hp; return e;
}

let game, player, enemies, parts = [], pops = [], T = 0, hitstop = 0;
const cam = { x:0, shake:0 };

function resetAll() {
  game = { mode: game ? game.mode : 'title', checkpoint:0, lit:[true,false], locked:false, introT:0, banner:null, big:null, deadT:0, winT:0 };
  enemies = SPAWNS.map(([t, x]) => mkEnemy(t, x)).concat([mkEnemy('boss', BOSS_X)]);
  player = newPlayer(IDOLS[0] + 40);
  parts = []; pops = [];
  cam.x = 0;
}
function respawn() {
  const cp = game.checkpoint;
  if (cp === 1) enemies = [mkEnemy('boss', BOSS_X)];
  else enemies = SPAWNS.map(([t, x]) => mkEnemy(t, x)).concat([mkEnemy('boss', BOSS_X)]);
  player = newPlayer(IDOLS[cp] + 40);
  game.locked = false; game.mode = 'play'; game.deadT = 0; game.banner = null; game.big = null;
  parts = []; pops = [];
  cam.x = clamp(player.x - VW * .42, 0, WORLD_R - VW);
}
function startGame() {
  if (game.mode !== 'title') return;
  game.mode = 'play';
  for (const k in pressed) delete pressed[k];
}

// ---------- effects ----------
function burst(x, y, list, color, n, spd, up = 60) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, v = spd * (.35 + Math.random());
    const life = .45 + Math.random() * .45;
    parts.push({ x, y, vx:Math.cos(a) * v, vy:Math.sin(a) * v - up, life, max:life, txt:String(list[(Math.random() * list.length) | 0]), color, sz:8 + Math.random() * 6 });
  }
}
function pop(x, y, txt, color, size = 14, dur = 1) { pops.push({ x, y, txt, color, size, t:0, dur }); }
function big(txt, color, sub) { game.big = { txt, color, sub, t:0, dur:1.5 }; }
function shake(v) { if (!reduceMotion) cam.shake = Math.max(cam.shake, v); }

// ---------- geometry ----------
function wpt(e, pt) {
  let x = pt[0] * e.sc, y = pt[1] * e.sc;
  if (e.rot) { const c = Math.cos(e.rot), s = Math.sin(e.rot); const nx = x * c - y * s; y = x * s + y * c; x = nx; }
  return [e.x + e.f * x, e.y + y];
}
function wAng(e) { const a = e.pose.wa + e.rot; return Math.atan2(Math.sin(a), Math.cos(a) * e.f); }

// ---------- combat ----------
function nearestFoe(r) {
  let best = null, bd = r;
  for (const e of enemies) { if (!e.alive || !e.aggro) continue; const d = Math.abs(e.x - player.x); if (d < bd) { bd = d; best = e; } }
  return best;
}
function executable() {
  for (const e of enemies) if (e.alive && e.state === 'broken' && Math.abs(e.x - player.x) < 100 && Math.abs(e.y - player.y) < 60) return e;
  return null;
}
function contact(a, b) { return [(a.x + b.x) / 2, Math.min(a.y, b.y) - 58]; }

function breakEnemy(e, byHp) {
  e.state = 'broken'; e.st = 0; e.vx = 0; e.peril = 0;
  e.brokenDur = byHp ? 1e9 : (e.boss ? 3 : 2.6); e.post = e.maxPost;
  sfx.brk(); const c = wpt(e, [0, -58]); burst(c[0], c[1], e.wp.codes, C.gold, 14, 160);
}
function checkBreak(e) { if (e.post >= e.maxPost && e.state !== 'broken' && e.state !== 'dead') breakEnemy(e, false); }
function breakPlayer(dmg) {
  const p = player; p.state = 'broken'; p.st = 0; p.post = p.maxPost; p.hp -= dmg; p.hitFlash = .2;
  sfx.brk(); shake(6); pop(p.x, p.y - 110, 'POSTURE BROKEN', C.gold, 12, 1);
  if (p.hp <= 0) killPlayer();
}
function killPlayer() {
  const p = player; p.hp = 0; p.state = 'dead'; p.st = 0; p.vx = 0;
  game.mode = 'dead'; game.deadT = 0; sfx.die(); shake(8);
}

function strikeEnemy(e, A) {
  if (e.state === 'dead' || e.state === 'broken') return;
  const p = player, c = contact(p, e), faces = sgn(p.x - e.x) === e.f;
  if (e.state === 'guard' && faces) {
    if (Math.random() < e.deflect) {
      sfx.clang(); burst(c[0], c[1], e.wp.codes, C.gold, 10, 190); hitstop = .05; shake(3);
      p.post += 14; p.postCool = 1; e.post += 2;
      e.state = 'idle'; e.cd = Math.min(e.cd, .12);
      if (p.post >= p.maxPost) breakPlayer(6);
    } else {
      sfx.block(); burst(c[0], c[1], p.wp.codes, C.gold, 5, 120);
      e.post += A.post * (e.boss ? .9 : 1.3); e.postCool = 1.2; e.vx = -e.f * 90;
      if (++e.guardHits >= 2) { e.guardHits = 0; e.state = 'idle'; e.cd = 0; }
    }
    checkBreak(e); return;
  }
  e.hp -= A.dmg; e.post += A.post; e.postCool = 1.2; e.hitFlash = .12; e.guardHits = 0;
  sfx.hit(); burst(c[0], c[1] + 6, codes('BLOOD'), C.blood, 8, 150); shake(2);
  if (e.boss) {

    ctx.shadowBlur = 0; ctx.fillStyle = C.bone; ctx.font = `600 12px ${MONO}`; ctx.fillText(b.sub, cx, mid + 32);
    ctx.globalAlpha = 1;
  }
  if (game.mode === 'dead') {
    const a = Math.min(1, game.deadT / .9);
    ctx.fillStyle = `rgba(10,12,19,${.72 * a})`; ctx.fillRect(0, 0, VW, VH);
    ctx.globalAlpha = a; ctx.fillStyle = C.blood; ctx.shadowColor = C.blood; ctx.shadowBlur = 30;
    ctx.font = `800 200px ${SERIF}`; ctx.fillText('死', cx, mid + 40);
    ctx.shadowBlur = 0; ctx.font = `600 12px ${MONO}`; ctx.fillStyle = C.bone;
    if (game.deadT > 1.1) {
      if (player.rez > 0) ctx.fillText(isTouch ? 'STRIKE  resurrect' : 'J  resurrect   (1 left)', cx, mid + 90);
      ctx.fillStyle = C.dim; ctx.fillText(isTouch ? 'GUARD  return to the idol' : 'R  return to the sculptor’s idol', cx, mid + 112);
    }
    ctx.globalAlpha = 1;
  }
  if (game.mode === 'win') {
    ctx.fillStyle = 'rgba(10,12,19,.6)'; ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = C.bone; ctx.font = `800 40px ${SERIF}`; ctx.fillText('Genichiro Ashina has fallen', cx, mid - 20);
    ctx.fillStyle = C.pb; ctx.font = `600 12px ${MONO}`;
    ctx.fillText(codes('SHINOBI').join(' ') + '  ·  ' + codes('WINS').join(' '), cx, mid + 14);
    ctx.fillStyle = C.dim; ctx.fillText(isTouch ? 'STRIKE  play again' : 'R  play again', cx, mid + 44);
  }
  if (game.mode === 'title') {
    ctx.fillStyle = 'rgba(10,12,19,.62)'; ctx.fillRect(0, 0, VW, VH);
    const lx = Math.max(24, cx - 300), ty = OY + 120;
    ctx.textAlign = 'left';
    ctx.fillStyle = C.blood; ctx.font = `800 64px ${SERIF}`; ctx.fillText('隻狼', lx, ty);
    ctx.fillStyle = C.bone; ctx.font = `800 36px ${SERIF}`; ctx.fillText('Shadows Wired Twice', lx, ty + 46);
    ctx.fillStyle = C.dim; ctx.font = `600 10px ${MONO}`;
    ctx.fillText('WIREFRAME BODIES · BLADES FORGED FROM ASCII CODES', lx, ty + 68);
    ctx.fillStyle = C.pb; ctx.fillText('K U S A B I M A R U  →  ' + WP.kusabimaru.codes.join(' '), lx, ty + 86);
    const rows = isTouch
      ? [['◀ ▶', 'move'], ['JUMP', 'jump · clears a 危 sweep'], ['STRIKE', 'attack · deathblow'], ['GUARD', 'block · tap on impact to deflect'], ['STEP', 'dodge · into a 危 thrust = Mikiri'], ['GOURD', 'heal']]
      : [['A D  or arrows', 'move'], ['W  Space', 'jump · clears a 危 sweep'], ['J  Z  click', 'attack · deathblow when the red mark shows'], ['K  X  right-click', 'guard · tap as the blow lands to deflect'], ['L  Shift', 'step · into a 危 thrust = Mikiri counter'], ['E', 'drink from the healing gourd']];
    ctx.font = `600 11px ${MONO}`;
    rows.forEach(([k, v], i) => {
      const yy = ty + 122 + i * 20;
      ctx.fillStyle = C.bone; ctx.fillText(k, lx, yy);
      ctx.fillStyle = C.dim; ctx.fillText(v, lx + 150, yy);
    });
    ctx.globalAlpha = .55 + .45 * Math.sin(T * 3);
    ctx.fillStyle = C.gold; ctx.fillText(isTouch ? 'TAP TO BEGIN' : 'PRESS ANY KEY', lx, ty + 122 + rows.length * 20 + 24);
    ctx.globalAlpha = 1;
  }
}

// ---------- render ----------
function render(dt) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = C.ink; ctx.fillRect(0, 0, cv.width, cv.height);
  const sx = cam.shake > .2 ? rand(-cam.shake, cam.shake) : 0, sy = cam.shake > .2 ? rand(-cam.shake, cam.shake) * .6 : 0;
  const k = DPR * S;
  ctx.setTransform(k, 0, 0, k, sx * k, (OY + sy) * k);
  drawBackground();
  drawPetals(dt);

  ctx.save(); ctx.translate(-cam.x, 0);
  ctx.font = `400 10px ${MONO}`; ctx.textAlign = 'center'; ctx.fillStyle = C.dim;
  for (const [hx, t] of HINTS) if (Math.abs(hx - cam.x - VW / 2) < VW) { ctx.globalAlpha = .75; ctx.fillText(t, hx, GROUND + 28); }
  ctx.globalAlpha = 1;
  IDOLS.forEach((x, i) => drawIdol(x, game.lit[i]));
  if (game.locked) { drawGate(ARENA_L); drawGate(ARENA_R); }
  for (const e of enemies) if (e.state === 'dead') drawFighter(e);
  for (const e of enemies) if (e.state !== 'dead') drawFighter(e);
  drawFighter(player);
  for (const e of enemies) drawEnemyUI(e);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const q of parts) { ctx.globalAlpha = clamp(q.life / q.max, 0, 1); ctx.fillStyle = q.color; ctx.font = `600 ${q.sz}px ${MONO}`; ctx.fillText(q.txt, q.x, q.y); }
  for (const q of pops) { ctx.globalAlpha = clamp(1 - q.t / q.dur, 0, 1); ctx.fillStyle = q.color; ctx.font = `600 ${q.size}px ${MONO}`; ctx.fillText(q.txt, q.x, q.y - q.t * 24); }
  ctx.globalAlpha = 1;
  ctx.restore();

  ctx.setTransform(k, 0, 0, k, 0, 0);
  if (game.mode !== 'title') drawHUD();
  ctx.setTransform(k, 0, 0, k, 0, 0);
  drawOverlays();
}

// ---------- loop ----------
resetAll();
let last = performance.now();
function frame(now) {
  let dt = Math.min(.033, (now - last) / 1000); last = now;
  const rdt = dt; T += dt;
  if (hitstop > 0) { hitstop -= dt; dt *= .08; }
  update(dt);
  render(rdt);
  for (const k in pressed) delete pressed[k];
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
