<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hoodratz</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0b10; overflow: hidden; }
    canvas { display: block; position: absolute; inset: 0; margin: auto; }
    .menu-controls { position: fixed; left: 50%; top: 50%; width: 1280px; height: 720px; pointer-events: none; transform: translate(-50%, -50%); }
    .menu-controls[hidden] { display: none; }
    .menu-controls button { position: absolute; left: 470px; width: 340px; height: 66px; border: 0; border-radius: 14px; background: transparent; color: transparent; font: bold 26px sans-serif; pointer-events: auto; cursor: pointer; }
    .menu-controls button:focus { outline: none; }
    .menu-controls button:focus-visible { outline: 3px solid #e6edf6; outline-offset: 5px; }
  </style>
</head>
<body>
  <canvas id="game" width="1280" height="720"></canvas>
  <nav id="home-menu" class="menu-controls" aria-label="Home menu">
    <button type="button" style="top:300px">Play</button>
    <button type="button" style="top:384px">Practice</button>
    <button type="button" style="top:468px">Quit</button>
  </nav>
  <section id="quit-menu" class="menu-controls" aria-label="Game exited" hidden>
    <button type="button" style="top:420px">Back to menu</button>
  </section>
  <!-- Classic scripts (not modules) so the game runs by opening this file directly. -->
