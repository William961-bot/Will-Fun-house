    .menu-controls[hidden] { display: none; }
    .menu-controls button { position: absolute; left: 470px; width: 340px; height: 66px; border: 0; border-radius: 14px; background: transparent; color: transparent; font: bold 26px sans-serif; pointer-events: auto; cursor: pointer; }
    .menu-controls button:focus { outline: none; }
    .menu-controls button:focus-visible { outline: 3px solid #e6edf6; outline-offset: 5px; }

  <script>
  // Mocap check for Duttpack: left is his hand-made hype-hands idle, right loops the Hype Shuffle recorded from
  // the reference video (src/mocap/shuffle.js). Nothing here changes the game; it only overrides one drawn pose.
  const kit = CHARACTER_ABILITIES.duttpack, handMade = kit.pose.bind(kit);
  kit.pose = (f, t, frame) => f.index === 1 && f.state === 'idle' ? mocapPose('shuffle', t * 1.5) : handMade(f, t, frame);
  function stage() {
    startMatch(false, [{ type: 'keyboard', layout: 0 }, { type: 'keyboard', layout: 1 }], ['duttpack', 'duttpack']);
    g.phase = 'fight'; g.inputLocked = true; g.popups = [];
    document.getElementById('home-menu').hidden = true;
    p1.reset(470, 1); p2.reset(810, 1);
  }
  stage();
  const fullTime = g.roundTime; setInterval(() => { g.roundTime = fullTime; }, 1000);
  const ref = new Image(); ref.src = '../assets/reference/shuffle.gif';
  Object.assign(ref.style, { position: 'fixed', right: '12px', bottom: '12px', width: '220px', border: '2px solid #d4a64a' });
  ref.onerror = () => ref.remove();
  document.body.appendChild(ref);
  const label = (text, left) => { const d = document.createElement('div'); d.textContent = text;
    Object.assign(d.style, { position: 'fixed', top: '12px', left, transform: 'translateX(-50%)', color: '#fff', font: 'bold 18px sans-serif', background: '#000a', padding: '6px 12px', borderRadius: '8px' });
    document.body.appendChild(d); };
  label('IDLE: HYPE HANDS (hand-made)', '35%'); label('HYPE SHUFFLE (from your video)', '65%');
  </script>
