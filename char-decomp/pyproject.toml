[project]
name = "chardecomp"
version = "0.2.0"
description = "Evidence-first decomp of one game character: every finding is checked against recorded traces"
requires-python = ">=3.10"
dependencies = ["frida>=17", "lief>=0.15", "capstone>=5"]

[project.optional-dependencies]
agent = ["anthropic>=0.75"]
dev = ["pytest", "pytest-cov", "ziglang"]

[project.scripts]
chardecomp = "chardecomp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["chardecomp", "chardecomp.ucs", "chardecomp.assets", "chardecomp.port"]

[tool.setuptools.package-data]
chardecomp = ["frida_agent.js", "ghidra/*.java"]
"chardecomp.port" = ["godot_runtime/*.gd"]
